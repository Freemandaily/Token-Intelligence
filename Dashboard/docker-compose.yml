services:
  backend:
    build:
      context: ./backend
    container_name: dex_backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - DUCKDB_PATH=/data/analytics.duckdb
    volumes:
      - ./backend:/app
      - ../data:/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - dex_network

  frontend:
    image: node:20-alpine
    container_name: dex_frontend
    working_dir: /app
    ports:
      - "3000:5173"
    environment:
      - BACKEND_URL=http://dex_backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - dex_network

networks:
  dex_network:
    driver: bridge
  local_test_network:
    external: true
